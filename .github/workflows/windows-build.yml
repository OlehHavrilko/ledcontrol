name: windows-build

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r tools/windows/requirements-build.txt

      - name: Build EXE (PyInstaller)
        shell: pwsh
        run: |
          Remove-Item -Recurse -Force dist, build -ErrorAction SilentlyContinue
          pyinstaller --noconfirm --clean --windowed --name "elk-bledom-controller" main.py
          Get-ChildItem -Recurse dist

      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup -y
          iscc /?

      - name: Build Installer (Inno Setup)
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          if ($tag -like "v*") { $ver = $tag.Substring(1) } else { $ver = "0.0.0-dev" }
          iscc /DMyAppVersion=$ver tools\\windows\\installer.iss
          Get-ChildItem -Recurse dist-installer

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: elk-bledom-windows
          path: |
            dist/elk-bledom-controller/**
            dist-installer/*.exe

      - name: Release (tagged builds)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist-installer/*.exe

